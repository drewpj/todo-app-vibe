server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: forward to the backend container. X-Forwarded-For lets the API rate-limit by the real client IP.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Vite emits content-hashed filenames, so these are safe to cache "forever".
    # (`expires` is used instead of add_header so the security headers above keep being inherited.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must always be revalidated so users pick up new deployments.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri /index.html;
    }
}
